spring:
  application:
    name: analoghub-backend
  
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:analoghub}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # datasource:
  #   url: jdbc:h2:mem:analoghub_db
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

analoghub:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:ap-southeast-1}
    access-key: ${S3_ACCESS_KEY:root}
    secret-key: ${S3_SECRET_KEY:password}
    bucket: ${S3_BUCKET:analoghub-media}
    path-style-access-enabled: true
